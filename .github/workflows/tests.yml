name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # requirements-dev.txt builds on requirements-core.txt, which leaves out
      # sentence-transformers/torch (multi-GB, multi-minute install). No test
      # loads the embedding model — resume_matcher imports it lazily — so the
      # whole suite, including the API tests, runs without it.
      - name: Install test dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v
