<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Internship Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12151C;
    --surface: #1B2029;
    --surface-hi: #232A36;
    --text: #EDEAE3;
    --text-dim: #9AA1AE;
    --matched: #6FA88A;
    --missing: #C97D4E;
    --bonus: #7C93B3;
    --border: #2A3140;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.5;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
  }

  /* --- Signature element: the agent trace rail --- */
  .trace-rail {
    display: flex;
    gap: 0;
    padding: 16px 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .trace-step {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    font-size: 12px;
    color: var(--text-dim);
    transition: color 0.3s ease;
  }
  .trace-step:last-child { border-right: none; }
  .trace-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #3A4152;
    transition: background 0.3s ease, box-shadow 0.3s ease;
    flex-shrink: 0;
  }
  .trace-step.pending .trace-dot { background: #3A4152; }
  .trace-step.running .trace-dot {
    background: var(--bonus);
    box-shadow: 0 0 0 4px rgba(124,147,179,0.2);
    animation: pulse 1s infinite;
  }
  .trace-step.ok .trace-dot { background: var(--matched); }
  .trace-step.degraded .trace-dot { background: var(--missing); }
  .trace-step.failed .trace-dot { background: #C9584E; }
  .trace-step.ok, .trace-step.degraded, .trace-step.failed { color: var(--text); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--ink);
    padding: 28px 32px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 0 0 14px;
    font-weight: 600;
  }
  textarea {
    width: 100%;
    min-height: 180px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    resize: vertical;
    margin-bottom: 20px;
  }
  textarea:focus {
    outline: 2px solid var(--bonus);
    outline-offset: 1px;
  }

  button.primary {
    background: var(--matched);
    color: #0E1712;
    border: none;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'IBM Plex Sans', sans-serif;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .coverage-ring-wrap {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
  }
  .coverage-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 34px;
    font-weight: 600;
  }
  .coverage-label { color: var(--text-dim); font-size: 13px; }

  .chip-group { margin-bottom: 22px; }
  .chip-group-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid transparent;
  }
  .chip.matched { background: rgba(111,168,138,0.15); color: var(--matched); border-color: rgba(111,168,138,0.3); }
  .chip.missing { background: rgba(201,125,78,0.15); color: var(--missing); border-color: rgba(201,125,78,0.3); }
  .chip.bonus { background: rgba(124,147,179,0.15); color: var(--bonus); border-color: rgba(124,147,179,0.3); }

  .bullet-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .bullet-card .orig {
    color: var(--text-dim);
    font-size: 12.5px;
    text-decoration: line-through;
    margin-bottom: 8px;
  }
  .bullet-card .new {
    color: var(--text);
    font-size: 13.5px;
    font-weight: 500;
  }

  .empty-state {
    color: var(--text-dim);
    font-size: 13.5px;
    padding: 40px 0;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>Internship Application Copilot</h1>
  <p>Paste a resume and a job description — the agent parses, matches, finds gaps, and rewrites bullets.</p>
</header>

<div class="trace-rail" id="traceRail"></div>

<main>
  <div class="panel">
    <h2>Resume</h2>
    <textarea id="resumeInput" placeholder="Paste your resume text here..."></textarea>
    <h2>Job Description</h2>
    <textarea id="jdInput" placeholder="Paste the job description here..."></textarea>
    <button class="primary" id="analyzeBtn">Run analysis</button>
  </div>

  <div class="panel" id="resultsPanel">
    <div class="empty-state">Results will appear here once you run an analysis.</div>
  </div>
</main>

<script>
// When opened directly as a file (double-clicked locally), talk to localhost:8000.
// When served by the backend itself (deployed, or served under /ui), use relative paths.
const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:8000' : '';

const STEPS = [
  { key: "jd_extraction", label: "jd_extraction" },
  { key: "resume_matching", label: "resume_matching" },
  { key: "gap_analysis", label: "gap_analysis" },
  { key: "bullet_rewriting", label: "bullet_rewriting" },
];

function renderTraceRail(stepStatuses) {
  const rail = document.getElementById('traceRail');
  rail.innerHTML = STEPS.map(s => {
    const status = stepStatuses[s.key] || 'pending';
    return `<div class="trace-step ${status}" data-step="${s.key}">
      <span class="trace-dot"></span>
      <span class="mono">${s.label}</span>
      <span class="mono">[${status}]</span>
    </div>`;
  }).join('');
}

function chipHtml(list, cls) {
  if (!list || list.length === 0) return `<span class="mono" style="color:var(--text-dim); font-size:12px;">none</span>`;
  return list.map(s => `<span class="chip ${cls}">${s}</span>`).join('');
}

async function runAnalysis() {
  const resume = document.getElementById('resumeInput').value.trim();
  const jd = document.getElementById('jdInput').value.trim();
  const btn = document.getElementById('analyzeBtn');
  const resultsPanel = document.getElementById('resultsPanel');

  if (resume.length < 20 || jd.length < 20) {
    resultsPanel.innerHTML = `<div class="empty-state">Paste at least a few lines in both fields (20+ characters each) before running.</div>`;
    return;
  }

  btn.disabled = true;
  btn.textContent = "Analyzing...";

  // Step 1: fast offline path so something shows immediately
  const stepStatuses = { jd_extraction: 'running' };
  renderTraceRail(stepStatuses);

  try {
    const quickRes = await fetch(`${API_BASE}/analyze/quick`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resume_text: resume, jd_text: jd, llm_backend: 'ollama' }),
    });
    const quick = await quickRes.json();

    stepStatuses.jd_extraction = 'ok';
    stepStatuses.gap_analysis = 'ok';
    renderTraceRail(stepStatuses);
    renderResults({ gap_analysis: quick, rewritten_bullets: [], steps: [] });

    // Step 2: full agent pipeline (LLM + embeddings) — may take longer, may degrade
    stepStatuses.resume_matching = 'running';
    stepStatuses.bullet_rewriting = 'pending';
    renderTraceRail(stepStatuses);

    const fullRes = await fetch(`${API_BASE}/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ resume_text: resume, jd_text: jd, llm_backend: 'ollama' }),
    });
    const full = await fullRes.json();

    (full.steps || []).forEach(s => { stepStatuses[s.step] = s.status; });
    renderTraceRail(stepStatuses);
    renderResults(full);

  } catch (err) {
    resultsPanel.innerHTML = `<div class="empty-state">Couldn't reach the API at ${API_BASE}. Make sure <span class="mono">uvicorn main:app --port 8000</span> is running.</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Run analysis";
  }
}

function renderResults(data) {
  const gap = data.gap_analysis || {};
  const coverage = gap.coverage_pct != null ? gap.coverage_pct : 0;

  let html = `
    <h2>Results</h2>
    <div class="coverage-ring-wrap">
      <div class="coverage-num mono">${coverage}%</div>
      <div class="coverage-label">of JD-required skills<br>found in your resume</div>
    </div>

    <div class="chip-group">
      <div class="chip-group-label">Matched</div>
      <div class="chips">${chipHtml(gap.matched_skills, 'matched')}</div>
    </div>
    <div class="chip-group">
      <div class="chip-group-label">Missing — worth addressing</div>
      <div class="chips">${chipHtml(gap.missing_skills, 'missing')}</div>
    </div>
    <div class="chip-group">
      <div class="chip-group-label">Bonus — resume has, JD didn't ask</div>
      <div class="chips">${chipHtml(gap.bonus_skills, 'bonus')}</div>
    </div>
  `;

  if (data.rewritten_bullets && data.rewritten_bullets.length > 0) {
    html += `<div class="chip-group-label" style="margin-top:8px;">Suggested bullet rewrites</div>`;
    data.rewritten_bullets.forEach(b => {
      html += `<div class="bullet-card">
        <div class="orig">${b.original}</div>
        <div class="new">${b.rewritten_bullet}</div>
      </div>`;
    });
  }

  document.getElementById('resultsPanel').innerHTML = html;
}

renderTraceRail({});
document.getElementById('analyzeBtn').addEventListener('click', runAnalysis);
</script>
</body>
</html>
