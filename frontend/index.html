<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Internship Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12151C;
    --surface: #1B2029;
    --surface-hi: #232A36;
    --text: #EDEAE3;
    --text-dim: #9AA1AE;
    --matched: #6FA88A;
    --missing: #C97D4E;
    --bonus: #7C93B3;
    --danger: #C9584E;
    --border: #2A3140;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.5;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  .dim { color: var(--text-dim); }
  [hidden] { display: none !important; }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px 24px;
    padding: 24px 32px 0;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0 0 16px; color: var(--text-dim); font-size: 14px; }
  .status-line { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #3A4152; }
  .pill.on .dot { background: var(--matched); }
  .pill.off .dot { background: var(--missing); }

  nav.tabs { display: flex; gap: 4px; width: 100%; }
  nav.tabs button {
    background: none; border: none; color: var(--text-dim);
    font: 600 13px 'IBM Plex Sans', sans-serif;
    padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent;
  }
  nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--matched); }
  nav.tabs button:focus-visible { outline: 2px solid var(--bonus); outline-offset: -2px; }

  /* --- Signature element: the agent trace rail --- */
  .trace-rail {
    display: flex;
    padding: 12px 32px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .trace-step {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 18px;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    font-size: 12px;
    color: var(--text-dim);
    transition: color 0.3s ease;
  }
  .trace-step:last-child { border-right: none; }
  .trace-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #3A4152;
    transition: background 0.3s ease, box-shadow 0.3s ease;
    flex-shrink: 0;
  }
  .trace-step.running .trace-dot {
    background: var(--bonus);
    box-shadow: 0 0 0 4px rgba(124,147,179,0.2);
    animation: pulse 1s infinite;
  }
  .trace-step.ok .trace-dot { background: var(--matched); }
  .trace-step.degraded .trace-dot, .trace-step.skipped .trace-dot { background: var(--missing); }
  .trace-step.failed .trace-dot { background: var(--danger); }
  .trace-step.ok, .trace-step.degraded, .trace-step.failed, .trace-step.skipped { color: var(--text); }
  .trace-ms { color: var(--text-dim); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @media (prefers-reduced-motion: reduce) { .trace-step.running .trace-dot { animation: none; } }

  main.grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 960px) { main.grid { grid-template-columns: minmax(0, 1fr); } }

  .panel { background: var(--ink); padding: 24px 32px; min-width: 0; }
  @media (max-width: 600px) {
    .panel, header, .trace-rail { padding-left: 16px; padding-right: 16px; }
  }
  h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); margin: 0 0 10px; font-weight: 600;
  }
  .field-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .field-head h2 { margin: 0; }
  .field-tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  textarea, input[type="text"], input[type="url"], input[type="search"], select, input[type="number"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
  }
  textarea {
    width: 100%; min-height: 190px; padding: 14px; resize: vertical; margin-bottom: 6px;
  }
  input[type="text"], input[type="url"], input[type="search"], input[type="number"], select { padding: 7px 10px; }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--bonus); outline-offset: 1px; }
  .counter { font-size: 11px; color: var(--text-dim); text-align: right; margin-bottom: 16px; }
  .counter.over { color: var(--danger); }
  .url-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .url-row input { flex: 1; min-width: 0; }

  button {
    font-family: 'IBM Plex Sans', sans-serif;
    border-radius: 6px; cursor: pointer;
  }
  button.primary {
    background: var(--matched); color: #0E1712; border: none;
    font-weight: 600; font-size: 14px; padding: 12px 22px;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.primary:disabled, button.ghost:disabled { opacity: 0.5; cursor: not-allowed; }
  button.ghost, label.ghost {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    font-size: 12px; font-weight: 500; padding: 6px 11px; display: inline-block; cursor: pointer;
  }
  button.ghost:hover, label.ghost:hover { background: var(--surface-hi); }
  button.danger { color: var(--danger); }
  button:focus-visible, label.ghost:focus-within { outline: 2px solid var(--text); outline-offset: 2px; }
  label.ghost input { position: absolute; opacity: 0; width: 1px; height: 1px; }

  .options { display: flex; flex-wrap: wrap; gap: 14px 20px; align-items: center; margin-bottom: 18px; font-size: 13px; }
  .options label { display: inline-flex; align-items: center; gap: 8px; color: var(--text-dim); }
  .options input[type="number"] { width: 64px; }
  .run-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .notice { font-size: 13px; color: var(--text-dim); }
  .notice.error { color: var(--danger); }

  .score-row { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; margin-bottom: 22px; }
  .big-num { font-family: 'IBM Plex Mono', monospace; font-size: 38px; font-weight: 600; line-height: 1; }
  .big-label { color: var(--text-dim); font-size: 12.5px; margin-top: 6px; }
  .label-strong { color: var(--matched); }
  .label-fair { color: var(--bonus); }
  .label-weak { color: var(--missing); }
  .components { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; }
  .bar { width: 120px; height: 5px; background: var(--surface-hi); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar > span { display: block; height: 100%; background: var(--bonus); }

  .section { margin-bottom: 24px; }
  .chip-group { margin-bottom: 16px; }
  .chip-group-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-dim); margin-bottom: 8px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: 'IBM Plex Mono', monospace; font-size: 12px;
    padding: 4px 10px; border-radius: 4px; border: 1px solid transparent;
  }
  .chip.matched { background: rgba(111,168,138,0.15); color: var(--matched); border-color: rgba(111,168,138,0.3); }
  .chip.missing { background: rgba(201,125,78,0.15); color: var(--missing); border-color: rgba(201,125,78,0.3); }
  .chip.bonus { background: rgba(124,147,179,0.15); color: var(--bonus); border-color: rgba(124,147,179,0.3); }
  .chip[title] { cursor: help; }

  .gap-list, .issue-list { list-style: none; padding: 0; margin: 0; }
  .gap-list li, .issue-list li {
    display: flex; gap: 10px; align-items: baseline; padding: 7px 0;
    border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .prio {
    font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase;
    padding: 1px 7px; border-radius: 3px; flex-shrink: 0; min-width: 66px; text-align: center;
  }
  .prio.critical { background: rgba(201,88,78,0.2); color: #E08177; }
  .prio.high { background: rgba(201,125,78,0.2); color: var(--missing); }
  .prio.moderate { background: rgba(124,147,179,0.18); color: var(--bonus); }
  .prio.low { background: var(--surface-hi); color: var(--text-dim); }
  .prio.warning { background: rgba(201,125,78,0.2); color: var(--missing); }
  .prio.info { background: var(--surface-hi); color: var(--text-dim); }
  .issue-quote { display: block; color: var(--text-dim); font-size: 12px; margin-top: 2px; }

  .bullet-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 14px 16px; margin-bottom: 12px;
  }
  .bullet-card .orig { color: var(--text-dim); font-size: 12.5px; text-decoration: line-through; margin-bottom: 8px; }
  .bullet-card.kept .orig { text-decoration: none; }
  .bullet-card .new { color: var(--text); font-size: 13.5px; font-weight: 500; }
  .bullet-card .note { color: var(--text-dim); font-size: 12px; margin-top: 8px; }
  .bullet-card .card-actions { margin-top: 10px; display: flex; gap: 6px; }

  .actions-bar { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 22px; }
  .empty-state { color: var(--text-dim); font-size: 13.5px; padding: 40px 0; text-align: center; }
  .resp { margin: 0; padding-left: 18px; font-size: 13px; }

  /* --- Tracker --- */
  .tracker { padding: 24px 32px; }
  @media (max-width: 600px) { .tracker { padding: 16px; } }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
  .stat .big-num { font-size: 26px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input[type="search"] { flex: 1; min-width: 160px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); font-weight: 600; background: var(--surface); }
  td .sub { color: var(--text-dim); font-size: 12px; }
  td a { color: var(--bonus); }
  tr:last-child td { border-bottom: none; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface-hi); border: 1px solid var(--border); color: var(--text);
    padding: 9px 16px; border-radius: 6px; font-size: 13px; z-index: 10;
    max-width: calc(100vw - 32px);
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Internship Application Copilot</h1>
    <p>Paste or upload a resume and a job description — the agent parses, matches, finds gaps, and rewrites bullets.</p>
  </div>
  <div class="status-line" id="statusLine" aria-live="polite"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tabAnalyze" aria-selected="true" aria-controls="viewAnalyze">Analyze</button>
    <button role="tab" id="tabTracker" aria-selected="false" aria-controls="viewTracker">Tracker</button>
  </nav>
</header>

<section id="viewAnalyze" role="tabpanel" aria-labelledby="tabAnalyze">
  <div class="trace-rail" id="traceRail"></div>
  <main class="grid">
    <div class="panel">
      <div class="field-head">
        <h2><label for="resumeInput">Resume</label></h2>
        <div class="field-tools">
          <label class="ghost">Upload PDF/DOCX<input type="file" id="resumeFile" accept=".pdf,.docx,.txt,.md"></label>
          <button class="ghost" id="sampleBtn" type="button">Load sample</button>
        </div>
      </div>
      <textarea id="resumeInput" placeholder="Paste your resume text here..."></textarea>
      <div class="counter" id="resumeCount"></div>

      <div class="field-head">
        <h2><label for="jdInput">Job Description</label></h2>
        <div class="field-tools">
          <label class="ghost">Upload<input type="file" id="jdFile" accept=".pdf,.docx,.txt,.md"></label>
        </div>
      </div>
      <div class="url-row" id="urlRow">
        <input type="url" id="jdUrl" placeholder="…or paste a job posting URL" aria-label="Job posting URL">
        <button class="ghost" id="fetchBtn" type="button">Fetch</button>
      </div>
      <textarea id="jdInput" placeholder="Paste the job description here..."></textarea>
      <div class="counter" id="jdCount"></div>

      <div class="options">
        <label>LLM
          <select id="backendSelect">
            <option value="ollama">Ollama (local, free)</option>
            <option value="anthropic">Claude (API)</option>
            <option value="none">None — offline only</option>
          </select>
        </label>
        <label>Rewrites <input type="number" id="rewriteCount" min="0" max="8" value="3"></label>
        <label><input type="checkbox" id="useEmbeddings" checked> Semantic matching</label>
      </div>
      <div class="run-row">
        <button class="primary" id="analyzeBtn" type="button">Run analysis</button>
        <span class="notice" id="runNotice" aria-live="polite"></span>
      </div>
    </div>

    <div class="panel" id="resultsPanel" aria-live="polite">
      <div class="empty-state">Results will appear here once you run an analysis.</div>
    </div>
  </main>
</section>

<section id="viewTracker" role="tabpanel" aria-labelledby="tabTracker" hidden>
  <div class="tracker">
    <div class="stats" id="statsGrid"></div>
    <div class="toolbar">
      <input type="search" id="trackerSearch" placeholder="Search company, role, notes" aria-label="Search applications">
      <select id="trackerFilter" aria-label="Filter by status"><option value="">All statuses</option></select>
      <button class="ghost" id="addAppBtn" type="button">+ Add manually</button>
    </div>
    <div id="trackerTable"></div>
  </div>
</section>

<div class="toast" id="toast" hidden role="status"></div>

<script>
// When opened directly as a file (double-clicked locally), talk to localhost:8000.
// When served by the backend itself (deployed, or served under /ui), use relative paths.
const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:8000' : '';
const STATUSES = ['saved', 'applied', 'interviewing', 'offer', 'rejected', 'withdrawn'];
const MAX_CHARS = 15000;

const STEPS = ["jd_extraction", "resume_matching", "gap_analysis", "bullet_rewriting"];

const $ = id => document.getElementById(id);
let lastResult = null;
let caps = null;

// Every piece of user- or LLM-supplied text goes through esc() before it touches innerHTML.
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { t.hidden = true; }, 2600);
}

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode etc. */ } },
};

async function api(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, options);
  let body = null;
  if (res.status !== 204) {
    try { body = await res.json(); } catch { body = null; }
  }
  if (!res.ok) {
    let detail = body && body.detail;
    if (Array.isArray(detail)) detail = detail.map(d => `${(d.loc || []).slice(-1)[0]}: ${d.msg}`).join('; ');
    const err = new Error(detail || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return body;
}

const postJSON = (path, data) => api(path, {
  method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data),
});

// ---------------- Capabilities / status ----------------

async function loadCapabilities() {
  const line = $('statusLine');
  try {
    caps = await api('/capabilities');
  } catch {
    line.innerHTML = `<span class="pill off"><span class="dot"></span>API offline — start <span class="mono">uvicorn main:app --port 8000</span></span>`;
    return;
  }
  const o = caps.ollama, a = caps.anthropic;
  const ollamaOk = o.reachable && o.model_pulled;
  const ollamaText = !o.reachable ? 'Ollama not running' : (o.model_pulled ? `Ollama · ${o.model}` : `Ollama · ${o.model} not pulled`);
  line.innerHTML = `
    <span class="pill on"><span class="dot"></span>API v${esc(caps.version)}</span>
    <span class="pill ${ollamaOk ? 'on' : 'off'}"><span class="dot"></span>${esc(ollamaText)}</span>
    <span class="pill ${a.configured ? 'on' : 'off'}"><span class="dot"></span>Claude ${a.configured ? '· ' + esc(a.model) : 'not configured'}</span>`;

  if (!caps.url_fetch) $('urlRow').hidden = true;
  const sel = $('backendSelect');
  sel.querySelector('option[value="anthropic"]').disabled = !a.configured;
  if (!store.get('copilot.backend') || sel.selectedOptions[0]?.disabled) {
    sel.value = ollamaOk ? 'ollama' : (a.configured ? 'anthropic' : 'none');
  }
}

// ---------------- Trace rail ----------------

function renderTraceRail(statuses, steps = []) {
  const byName = Object.fromEntries(steps.map(s => [s.step, s]));
  $('traceRail').innerHTML = STEPS.map(key => {
    const status = statuses[key] || 'pending';
    const info = byName[key];
    const ms = info && info.duration_ms ? `<span class="mono trace-ms">${info.duration_ms < 1000 ? info.duration_ms + 'ms' : (info.duration_ms / 1000).toFixed(1) + 's'}</span>` : '';
    const title = info && info.detail ? ` title="${esc(info.detail)}"` : '';
    return `<div class="trace-step ${esc(status)}"${title}>
      <span class="trace-dot"></span>
      <span class="mono">${esc(key)}</span>
      <span class="mono">[${esc(status)}]</span>${ms}
    </div>`;
  }).join('');
}

// ---------------- Inputs ----------------

function updateCounters() {
  for (const [input, counter] of [['resumeInput', 'resumeCount'], ['jdInput', 'jdCount']]) {
    const n = $(input).value.length;
    const el = $(counter);
    el.textContent = `${n.toLocaleString()} / ${MAX_CHARS.toLocaleString()} chars`;
    el.classList.toggle('over', n > MAX_CHARS);
  }
}

function persistInputs() {
  store.set('copilot.resume', $('resumeInput').value);
  store.set('copilot.jd', $('jdInput').value);
  store.set('copilot.backend', $('backendSelect').value);
  store.set('copilot.rewrites', $('rewriteCount').value);
  store.set('copilot.embeddings', $('useEmbeddings').checked ? '1' : '0');
}

function restoreInputs() {
  $('resumeInput').value = store.get('copilot.resume') || '';
  $('jdInput').value = store.get('copilot.jd') || '';
  const backend = store.get('copilot.backend');
  if (backend) $('backendSelect').value = backend;
  const rewrites = store.get('copilot.rewrites');
  if (rewrites !== null) $('rewriteCount').value = rewrites;
  $('useEmbeddings').checked = store.get('copilot.embeddings') !== '0';
  updateCounters();
}

async function uploadInto(fileInput, textarea) {
  const file = fileInput.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await api('/extract-text', { method: 'POST', body: form });
    $(textarea).value = res.text;
    updateCounters();
    persistInputs();
    toast(`Loaded ${res.chars.toLocaleString()} characters from ${file.name}`);
  } catch (err) {
    toast(`Upload failed: ${err.message}`);
  } finally {
    fileInput.value = '';
  }
}

async function fetchJd() {
  const url = $('jdUrl').value.trim();
  if (!url) { toast('Paste a job posting URL first'); return; }
  const btn = $('fetchBtn');
  btn.disabled = true; btn.textContent = 'Fetching…';
  try {
    const res = await postJSON('/jd/fetch', { url });
    $('jdInput').value = res.text;
    updateCounters();
    persistInputs();
    toast(res.source === 'json-ld' ? `Fetched “${res.title}”` : 'Fetched page text — trim anything that isn’t the job description');
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = false; btn.textContent = 'Fetch';
  }
}

const SAMPLE_RESUME = `Alex Rivera — alex.rivera@email.com — github.com/alexr
EDUCATION
B.S. Computer Science, State University (2027)
PROJECTS
• Built a HybridRAG customer complaint classifier using FAISS, Ollama, and Streamlit.
• Developed HoopSense AI, a basketball shooting analysis platform using React, FastAPI, MediaPipe, YOLOv8, and XGBoost.
• Responsible for building a resume parser and job matcher using NLP techniques and scikit-learn.

SKILLS
Python, SQL, Git, Docker basics`;

const SAMPLE_JD = `Machine Learning Engineering Intern - Summer 2027
About the role
You'll join our applied AI team building retrieval-augmented generation (RAG) features.
Requirements:
- Proficiency in Python and PyTorch
- Experience building RAG pipelines with LangChain and a vector database such as FAISS
- Deploy models via FastAPI and Docker on AWS
Nice to have:
- scikit-learn and SQL
- Familiarity with LangGraph or agent frameworks
Benefits: mentorship, free lunch, housing stipend.`;

// ---------------- Analysis ----------------

async function runAnalysis() {
  const resume = $('resumeInput').value.trim();
  const jd = $('jdInput').value.trim();
  const backend = $('backendSelect').value;
  const btn = $('analyzeBtn');
  const notice = $('runNotice');
  notice.className = 'notice';
  notice.textContent = '';

  if (resume.length < 20 || jd.length < 20) {
    notice.className = 'notice error';
    notice.textContent = 'Paste at least a few lines in both fields (20+ characters each).';
    return;
  }
  if (resume.length > MAX_CHARS || jd.length > MAX_CHARS) {
    notice.className = 'notice error';
    notice.textContent = `Each field must be under ${MAX_CHARS.toLocaleString()} characters.`;
    return;
  }
  persistInputs();

  btn.disabled = true;
  btn.textContent = 'Analyzing…';
  const statuses = { gap_analysis: 'running' };
  renderTraceRail(statuses);

  // Step 1: fast offline path so something shows immediately
  try {
    const quick = await postJSON('/analyze/quick', { resume_text: resume, jd_text: jd });
    statuses.gap_analysis = 'ok';
    lastResult = quick;
    renderResults(quick);
  } catch (err) {
    statuses.gap_analysis = 'failed';
    renderTraceRail(statuses);
    notice.className = 'notice error';
    notice.textContent = err.status ? err.message : `Couldn't reach the API at ${API_BASE || window.location.origin}. Is uvicorn running?`;
    btn.disabled = false; btn.textContent = 'Run analysis';
    return;
  }

  if (backend === 'none') {
    statuses.jd_extraction = 'skipped';
    statuses.resume_matching = 'skipped';
    statuses.bullet_rewriting = 'skipped';
    renderTraceRail(statuses);
    notice.textContent = 'Offline analysis complete.';
    btn.disabled = false; btn.textContent = 'Run analysis';
    return;
  }

  // Step 2: full agent pipeline (LLM + embeddings) — may take longer, may degrade.
  // Quick results stay on screen if this fails.
  Object.assign(statuses, { jd_extraction: 'running', resume_matching: 'running', bullet_rewriting: 'running' });
  renderTraceRail(statuses);
  notice.textContent = 'Running the full agent (LLM + embeddings)…';
  try {
    const full = await postJSON('/analyze', {
      resume_text: resume, jd_text: jd, llm_backend: backend,
      max_rewrites: Math.max(0, Math.min(8, parseInt($('rewriteCount').value, 10) || 0)),
      use_embeddings: $('useEmbeddings').checked,
    });
    (full.steps || []).forEach(s => { statuses[s.step] = s.status; });
    renderTraceRail(statuses, full.steps || []);
    lastResult = full;
    renderResults(full);
    const degraded = (full.steps || []).filter(s => s.status !== 'ok');
    notice.textContent = degraded.length ? `Done — ${degraded.length} step(s) degraded or skipped (hover the trace for details).` : 'Done.';
  } catch (err) {
    ['jd_extraction', 'resume_matching', 'bullet_rewriting'].forEach(k => { statuses[k] = 'failed'; });
    renderTraceRail(statuses);
    notice.className = 'notice error';
    notice.textContent = `Full analysis failed (${err.message}). Showing offline results.`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Run analysis';
  }
}

function chipHtml(list, cls, evidence = {}) {
  if (!list || list.length === 0) return `<span class="mono dim" style="font-size:12px;">none</span>`;
  return list.map(s => {
    const ev = evidence[s];
    const title = ev ? ` title="Evidence: ${esc(ev)}"` : '';
    return `<span class="chip ${cls}"${title}>${esc(s)}</span>`;
  }).join('');
}

function renderResults(data) {
  const gap = data.gap_analysis || {};
  const score = data.match_score || {};
  const overview = data.jd_overview || {};
  const evidence = (data.resume_match || {}).skill_evidence || {};
  const reqs = data.jd_requirements;
  let html = '';

  html += `<h2>Results${overview.role_title ? ' — ' + esc(overview.role_title) : ''}</h2>`;
  if (overview.company || overview.seniority) {
    html += `<div class="dim" style="font-size:13px;margin:-4px 0 14px;">${esc([overview.company, overview.seniority].filter(Boolean).join(' · '))}</div>`;
  }

  html += `<div class="score-row">`;
  if (score.score != null) {
    html += `<div><div class="big-num label-${esc(score.label)}">${esc(score.score)}</div>
      <div class="big-label">match score · ${esc(score.label)}</div></div>`;
  }
  html += `<div><div class="big-num">${esc(gap.coverage_pct ?? 0)}%</div>
    <div class="big-label">of JD skills<br>found in your resume</div></div>`;
  const comps = score.components || {};
  if (Object.keys(comps).length) {
    html += `<div class="components">` + Object.entries(comps).map(([k, v]) =>
      `<div><span class="dim">${esc(k)}</span> <span class="mono">${Math.round(v)}</span>
        <div class="bar"><span style="width:${Math.max(0, Math.min(100, Number(v) || 0))}%"></span></div></div>`).join('') + `</div>`;
  }
  html += `</div>`;

  html += `<div class="actions-bar">
    <button class="ghost" type="button" data-action="copy-report">Copy report</button>
    <button class="ghost" type="button" data-action="download-report">Download .md</button>
    <button class="ghost" type="button" data-action="save-tracker">Save to tracker</button>
  </div>`;

  html += `<div class="section">
    <div class="chip-group"><div class="chip-group-label">Matched</div><div class="chips">${chipHtml(gap.matched_skills, 'matched', evidence)}</div></div>
    <div class="chip-group"><div class="chip-group-label">Missing — worth addressing</div><div class="chips">${chipHtml(gap.missing_skills, 'missing')}</div></div>
    <div class="chip-group"><div class="chip-group-label">Bonus — resume has, JD didn't ask</div><div class="chips">${chipHtml(gap.bonus_skills, 'bonus')}</div></div>
  </div>`;

  const gaps = data.prioritized_gaps || [];
  if (gaps.length) {
    html += `<div class="section"><div class="chip-group-label">Gaps by priority</div><ul class="gap-list">` +
      gaps.map(g => `<li><span class="prio ${esc(g.priority)}">${esc(g.priority)}</span>
        <span><span class="mono">${esc(g.skill)}</span> <span class="dim">— ${esc(g.reason || '')}</span></span></li>`).join('') +
      `</ul></div>`;
  }

  const kw = data.keyword_analysis;
  if (kw && kw.keywords && kw.keywords.length) {
    html += `<div class="section"><div class="chip-group-label">ATS keywords from the JD — ${esc(kw.keyword_match_pct)}% in your resume</div>
      <div class="chips">` + kw.keywords.map(k =>
        `<span class="chip ${k.in_resume ? 'matched' : 'missing'}" title="${k.in_resume ? 'In your resume' : 'Not found in your resume'} · ${esc(k.jd_count)}× in JD">${esc(k.term)}</span>`).join('') +
      `</div></div>`;
  }

  if (reqs && reqs.key_responsibilities && reqs.key_responsibilities.length) {
    html += `<div class="section"><div class="chip-group-label">Key responsibilities (LLM)</div><ul class="resp">` +
      reqs.key_responsibilities.map(r => `<li>${esc(r)}</li>`).join('') + `</ul></div>`;
  }

  const bullets = data.rewritten_bullets || [];
  if (bullets.length) {
    html += `<div class="section"><div class="chip-group-label">Suggested bullet rewrites</div>`;
    bullets.forEach((b, i) => {
      const ok = b.status === 'ok';
      html += `<div class="bullet-card ${ok ? '' : 'kept'}">
        <div class="orig">${esc(b.original)}</div>
        ${ok ? `<div class="new">${esc(b.rewritten_bullet)}</div>` : ''}
        ${b.confidence_note ? `<div class="note">${esc(b.confidence_note)}</div>` : ''}
        ${ok ? `<div class="card-actions"><button class="ghost" type="button" data-action="copy-bullet" data-index="${i}">Copy</button></div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  const checks = data.resume_checks;
  if (checks && checks.issues && checks.issues.length) {
    html += `<div class="section"><div class="chip-group-label">Resume checks · ${esc(checks.bullet_count)} bullets · ${esc(checks.quantified_pct)}% quantified</div>
      <ul class="issue-list">` + checks.issues.map(i =>
        `<li><span class="prio ${esc(i.severity)}">${esc(i.severity)}</span>
          <span>${esc(i.suggestion)}${i.text ? `<span class="issue-quote">“${esc(i.text)}”</span>` : ''}</span></li>`).join('') +
      `</ul></div>`;
  }

  $('resultsPanel').innerHTML = html;
}

function toMarkdown(data) {
  const gap = data.gap_analysis || {};
  const score = data.match_score || {};
  const ov = data.jd_overview || {};
  const lines = [`# Match report — ${ov.role_title || 'Job description'}`];
  if (ov.company) lines.push(`_${ov.company}_`);
  if (score.score != null) lines.push('', `**Match score: ${score.score}/100 (${score.label})**`);
  lines.push('', `## Skills (${gap.coverage_pct ?? 0}% of JD skills covered)`,
    `- **Matched:** ${(gap.matched_skills || []).join(', ') || 'none'}`,
    `- **Missing:** ${(gap.missing_skills || []).join(', ') || 'none'}`,
    `- **Bonus:** ${(gap.bonus_skills || []).join(', ') || 'none'}`);
  const gaps = data.prioritized_gaps || [];
  if (gaps.length) {
    lines.push('', '## Gaps to address');
    gaps.forEach(g => lines.push(`- [${g.priority}] **${g.skill}** — ${g.reason || ''}`));
  }
  const kw = data.keyword_analysis;
  if (kw && kw.missing_keywords && kw.missing_keywords.length) {
    lines.push('', `## ATS keywords (${kw.keyword_match_pct}% present)`, `Missing: ${kw.missing_keywords.join(', ')}`);
  }
  const rewrites = (data.rewritten_bullets || []).filter(b => b.status === 'ok');
  if (rewrites.length) {
    lines.push('', '## Suggested bullet rewrites');
    rewrites.forEach(b => lines.push(`- ~~${b.original}~~`, `  → ${b.rewritten_bullet}`));
  }
  const issues = (data.resume_checks || {}).issues || [];
  if (issues.length) {
    lines.push('', '## Resume checks');
    issues.forEach(i => lines.push(`- ${i.suggestion}${i.text ? ` — “${i.text}”` : ''}`));
  }
  return lines.join('\n') + '\n';
}

async function copyText(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast(`${label} copied`);
  } catch {
    toast('Clipboard unavailable in this browser context');
  }
}

async function saveToTracker() {
  if (!lastResult) return;
  const ov = lastResult.jd_overview || {};
  const company = window.prompt('Company name?', ov.company || '');
  if (company === null) return;
  const gap = lastResult.gap_analysis || {};
  try {
    await postJSON('/applications', {
      company,
      role: ov.role_title || '',
      url: $('jdUrl').value.trim(),
      status: 'saved',
      match_score: (lastResult.match_score || {}).score ?? null,
      coverage_pct: gap.coverage_pct ?? null,
      missing_skills: gap.missing_skills || [],
      analysis: lastResult,
    });
    toast('Saved to tracker');
  } catch (err) {
    toast(`Couldn't save: ${err.message}`);
  }
}

$('resultsPanel').addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]');
  if (!btn || !lastResult) return;
  const action = btn.dataset.action;
  if (action === 'copy-report') copyText(toMarkdown(lastResult), 'Report');
  if (action === 'download-report') {
    const blob = new Blob([toMarkdown(lastResult)], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'match-report.md';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  if (action === 'save-tracker') saveToTracker();
  if (action === 'copy-bullet') copyText(lastResult.rewritten_bullets[Number(btn.dataset.index)].rewritten_bullet, 'Bullet');
});

// ---------------- Tracker ----------------

async function loadTracker() {
  const status = $('trackerFilter').value;
  const q = $('trackerSearch').value.trim();
  const params = new URLSearchParams();
  if (status) params.set('status', status);
  if (q) params.set('q', q);
  try {
    const [items, stats] = await Promise.all([api(`/applications?${params}`), api('/applications/stats')]);
    renderStats(stats);
    renderTable(items);
  } catch (err) {
    $('trackerTable').innerHTML = `<div class="empty-state">Couldn't load applications: ${esc(err.message)}</div>`;
  }
}

function renderStats(s) {
  const active = s.by_status.applied + s.by_status.interviewing;
  const tiles = [
    ['Tracked', s.total],
    ['Active', active],
    ['Interviewing', s.by_status.interviewing],
    ['Offers', s.by_status.offer],
    ['Avg match', s.avg_match_score ?? '—'],
    ['Response rate', s.response_rate_pct != null ? `${s.response_rate_pct}%` : '—'],
  ];
  let html = tiles.map(([label, value]) =>
    `<div class="stat"><div class="big-num">${esc(value)}</div><div class="big-label">${esc(label)}</div></div>`).join('');
  if (s.top_missing_skills.length) {
    html += `<div class="stat" style="grid-column: 1 / -1;"><div class="big-label" style="margin:0 0 8px;">Most-missed skills across postings — highest-leverage to learn next</div>
      <div class="chips">${s.top_missing_skills.map(m => `<span class="chip missing">${esc(m.skill)} ×${esc(m.count)}</span>`).join('')}</div></div>`;
  }
  $('statsGrid').innerHTML = html;
}

function renderTable(items) {
  if (!items.length) {
    $('trackerTable').innerHTML = `<div class="empty-state">No applications yet. Run an analysis and click “Save to tracker”, or add one manually.</div>`;
    return;
  }
  const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
  $('trackerTable').innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Company / role</th><th>Status</th><th>Match</th><th>Missing skills</th><th>Notes</th><th></th></tr></thead>
    <tbody>${items.map(it => `<tr data-id="${esc(it.id)}">
      <td><strong>${esc(it.company || '—')}</strong><div class="sub">${esc(it.role)}</div>
        ${safeUrl(it.url) ? `<div class="sub"><a href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener noreferrer">posting ↗</a></div>` : ''}
        ${it.applied_on ? `<div class="sub">applied ${esc(it.applied_on)}</div>` : ''}</td>
      <td><select data-field="status" aria-label="Status">${STATUSES.map(s => `<option value="${s}"${s === it.status ? ' selected' : ''}>${s}</option>`).join('')}</select></td>
      <td class="mono">${it.match_score != null ? esc(it.match_score) : '—'}</td>
      <td><div class="chips">${(it.missing_skills || []).slice(0, 6).map(m => `<span class="chip missing">${esc(m)}</span>`).join('') || '<span class="dim">—</span>'}</div></td>
      <td><input type="text" data-field="notes" value="${esc(it.notes)}" placeholder="Add a note" aria-label="Notes"></td>
      <td><button class="ghost danger" type="button" data-action="delete">Delete</button></td>
    </tr>`).join('')}</tbody></table></div>`;
}

$('trackerTable').addEventListener('change', async e => {
  const field = e.target.dataset.field;
  const row = e.target.closest('tr[data-id]');
  if (!field || !row) return;
  try {
    await api(`/applications/${row.dataset.id}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ [field]: e.target.value }),
    });
    toast('Updated');
    if (field === 'status') loadTracker();
  } catch (err) {
    toast(`Update failed: ${err.message}`);
  }
});

$('trackerTable').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-action="delete"]');
  if (!btn) return;
  const row = btn.closest('tr[data-id]');
  if (!window.confirm('Stop tracking this application?')) return;
  try {
    await api(`/applications/${row.dataset.id}`, { method: 'DELETE' });
    loadTracker();
  } catch (err) {
    toast(`Delete failed: ${err.message}`);
  }
});

$('addAppBtn').addEventListener('click', async () => {
  const company = window.prompt('Company name?');
  if (!company) return;
  const role = window.prompt('Role title?') || '';
  try {
    await postJSON('/applications', { company, role, status: 'saved' });
    loadTracker();
  } catch (err) {
    toast(`Couldn't add: ${err.message}`);
  }
});

let searchTimer;
$('trackerSearch').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadTracker, 250); });
$('trackerFilter').addEventListener('change', loadTracker);
$('trackerFilter').insertAdjacentHTML('beforeend', STATUSES.map(s => `<option value="${s}">${s}</option>`).join(''));

// ---------------- Tabs & wiring ----------------

function showTab(name) {
  const analyze = name === 'analyze';
  $('tabAnalyze').setAttribute('aria-selected', String(analyze));
  $('tabTracker').setAttribute('aria-selected', String(!analyze));
  $('viewAnalyze').hidden = !analyze;
  $('viewTracker').hidden = analyze;
  store.set('copilot.tab', name);
  if (!analyze) loadTracker();
}
$('tabAnalyze').addEventListener('click', () => showTab('analyze'));
$('tabTracker').addEventListener('click', () => showTab('tracker'));

$('resumeFile').addEventListener('change', e => uploadInto(e.target, 'resumeInput'));
$('jdFile').addEventListener('change', e => uploadInto(e.target, 'jdInput'));
$('fetchBtn').addEventListener('click', fetchJd);
$('jdUrl').addEventListener('keydown', e => { if (e.key === 'Enter') fetchJd(); });
$('sampleBtn').addEventListener('click', () => {
  $('resumeInput').value = SAMPLE_RESUME;
  $('jdInput').value = SAMPLE_JD;
  updateCounters();
  persistInputs();
});
['resumeInput', 'jdInput'].forEach(id => $(id).addEventListener('input', () => { updateCounters(); persistInputs(); }));
['backendSelect', 'rewriteCount', 'useEmbeddings'].forEach(id => $(id).addEventListener('change', persistInputs));
$('analyzeBtn').addEventListener('click', runAnalysis);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && !$('viewAnalyze').hidden) runAnalysis();
});

restoreInputs();
renderTraceRail({});
loadCapabilities();
if (store.get('copilot.tab') === 'tracker') showTab('tracker');
</script>
